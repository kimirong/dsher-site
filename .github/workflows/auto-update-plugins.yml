name: Auto-update plugins

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 01:00 UTC = 北京时间 09:00
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: auto-update-plugins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update plugin data + pages + sitemap
        run: python3 scripts/update-plugins.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit"
          else
            git commit -m "chore: auto-update plugins $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "Pushed update"
          fi
