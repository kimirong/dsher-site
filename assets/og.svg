<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">dsher.cn — 玩转 DeepSeek Harness 的社区落地页</title>
  <desc id="ogDesc">dsher.cn 是围绕 DeepSeek Harness (dsh) 的社区落地页：纯静态、中英双语、深色科技风，内置插件市场。</desc>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#648cff" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="630" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="#05070d"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="250" cy="-40" r="470" fill="url(#glow)"/>
    <circle cx="1120" cy="660" r="380" fill="url(#glow)" opacity="0.5"/>
  </g>

  <!-- ===== left: identity ===== -->
  <g transform="translate(56 0)">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="24" letter-spacing="5" fill="#22d3ee">DSHER.CN · DEEPSEEK HARNESS 社区</text>

    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-weight="800" font-size="96">
      <tspan fill="#5c6b8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="56">$ </tspan>
      <tspan fill="url(#grad)">dsher.cn</tspan>
    </text>

    <text x="0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="32" font-weight="600" fill="#e7eefb">玩转 dsh 的人，都叫 <tspan fill="#22d3ee">dsher</tspan>。</text>

    <text x="0" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
          font-size="23" fill="#93a1bf">社区落地页 · 插件市场 · 中英双语 · 纯静态</text>

    <text x="0" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="26" fill="#22d3ee">https://dsher.cn</text>
  </g>

  <!-- ===== right: terminal motif ===== -->
  <g transform="translate(700 70)">
    <rect width="444" height="490" rx="16" fill="#070b13" stroke="#7ab4ff" stroke-opacity="0.32"/>
    <rect width="444" height="46" rx="16" fill="#0c1322"/>
    <rect y="23" width="444" height="23" fill="#0c1322"/>
    <line x1="0" y1="46" x2="444" y2="46" stroke="#7aa0ff" stroke-opacity="0.14"/>

    <circle cx="22" cy="23" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="23" r="6" fill="#febc2e"/>
    <circle cx="66" cy="23" r="6" fill="#28c840"/>
    <text x="92" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#5c6b8a">dsher@dsh: ~</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="24" y="104"><tspan fill="#22d3ee">$ </tspan><tspan fill="#e7eefb">npx @deepseek-ai/dsh web</tspan></text>
      <text x="24" y="148" fill="#5c6b8a">▶ DeepSeek Harness 已就绪</text>
      <text x="24" y="184" fill="#5c6b8a">  Web UI → http://127.0.0.1:3080</text>
      <text x="24" y="220"><tspan fill="#22d3ee">$ </tspan><tspan fill="#e7eefb">dsh plugin add &lt;插件&gt;</tspan></text>
      <text x="24" y="256" fill="#7ee7b8">✓ bundle 已安装</text>
      <text x="24" y="312" fill="#5c6b8a"># 97 个插件 · 官方 / 社区 / 索引</text>
      <text x="24" y="360" fill="#22d3ee">$</text>
    </g>
    <rect x="40" y="344" width="12" height="24" rx="2" fill="#22d3ee"/>
  </g>
</svg>
